const tabLabels = {
  all:'All phrases', intro:'Introductions', food:'Food & drink', solo:'Solo & hotel',
  humour:'Humour', fish:'Fish & seafood', reactions:'Reactions', weather:'Weather',
  cars:'Cars & track day', feelings:'Feelings', polite:'Polite responses',
  yesno:'Yes / No', questions:'Questions', time:'Time & when', clarifying:'Clarifying',
  compliments:'Compliments', shopping:'Shopping', preferences:'Preferences',
  greetings:'Greetings', numbers:'Numbers', days:'Days & months', irregular_verbs:'Irregular verbs', regular_verbs:'Regular verbs', useful_words:'Useful words'

};

let learned = JSON.parse(localStorage.getItem('sarah_italian_v3') || '{}');
let filter = 'all';
const total = sections.reduce((s,sec) => s + sec.phrases.length, 0);

function save(){ localStorage.setItem('sarah_italian_v3', JSON.stringify(learned)); }
function toggle(key){ learned[key] = !learned[key]; save(); render(); }
function resetAll(){ if(confirm('Reset all your progress?')){ learned={}; save(); render(); } }

function setFilter(btn, cat){
  filter = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function buildTabs(){
  const wrap = document.getElementById('tabs');
  const keys = ['all', ...sections.map(s => s.id)];
  wrap.innerHTML = keys.map(k =>
    `<button class="tab${k==='all'?' active':''}" onclick="setFilter(this,'${k}')">${tabLabels[k]}</button>`
  ).join('');
}

function render(){
  const lc = Object.values(learned).filter(Boolean).length;
  const pct = Math.round(lc / total * 100);
  document.getElementById('prog-text').textContent = lc + ' of ' + total + ' phrases learned';
  document.getElementById('prog-bar').style.width = pct + '%';
  let html = '';
  sections.forEach(sec => {
    if(filter !== 'all' && filter !== sec.id) return;
    html += `<div class="section"><div class="section-heading"><span>${sec.icon}</span> ${sec.title}</div><table class="phrase-table"><thead><tr><th>&#10003;</th><th>English</th><th>Italian</th><th>Pronunciation</th></tr></thead><tbody>`;
    sec.phrases.forEach((p, i) => {
      const key = sec.id + '_' + i;
      const ok = !!learned[key];
      const star = p.star ? '<span class="star">&#9733;</span>' : '';
      html += `<tr class="phrase-row${ok?' learned':''}" onclick="toggle('${key}')"><td><span class="check-circle">${ok?'&#10003;':''}</span></td><td><strong>${p.en}</strong>${star}</td><td class="it-col">${p.it}</td><td class="pr-col">${p.pr}</td></tr>`;
    });
    html += `</tbody></table>`;
    if(sec.note) html += `<div class="note">${sec.note}</div>`;
    html += `</div>`;
  });
  document.getElementById('content').innerHTML = html;
}

function searchContent(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  let html = '';

  sections.forEach(sec => {
    sec.phrases.forEach((p, i) => {
      if (
        p.en.toLowerCase().includes(q) ||
        p.it.toLowerCase().includes(q)
      ) {
        const star = p.star ? '<span class="star">&#9733;</span>' : '';

        html += `<tr>
          <td></td>
          <td><strong>${p.en}</strong>${star}</td>
          <td class="it-col">${p.it}</td>
          <td class="pr-col">${p.pr}</td>
        </tr>`;
      }
    });
  });

  document.getElementById('content').innerHTML =
    `<table class="phrase-table">
      <thead>
        <tr>
          <th></th><th>English</th><th>Italian</th><th>Pronunciation</th>
        </tr>
      </thead>
      <tbody>${html}</tbody>
    </table>`;
}

buildTabs();
render();
</script>
